<style>
/* Layout: one phone-width column, one screen per game phase; cards are paper objects on a night table */
:root{
  --bg:#141a2e; --table:#1c2440; --line:#2c3658; --raise:#232c4d; --paper:#f3efe6; --ink:#1b1f2e; --ink2:#5b6280;
  --fg:#e9ecf6; --muted:#9aa3c2; --accent:#f2b33d;
  --civ:#3cc4a8; --uc:#e2558f; --mw:#cfd6ea; --sp:#8fa8ff; --night:#0d1224;
  --display:"Bowlby One","Cairo","Arial Black",Impact,sans-serif;
  --body:"Nunito","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.night{background:var(--night)}
.app{max-width:520px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.app>*{animation:rise .28s ease-out both}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--display);font-size:26px;letter-spacing:.5px;line-height:1}
.logo.sm{font-size:20px}
.logo span{color:var(--accent)}
.back{width:40px;height:40px;border-radius:50%;background:var(--line);color:var(--fg);font-size:26px;line-height:1;flex:none;padding:0 0 3px}
.phase{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900;white-space:nowrap}
h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--muted)}
p{margin:0;line-height:1.5;color:var(--muted)}
p b{color:var(--fg)}
.panel{background:var(--table);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper .name{font-weight:800;display:flex;align-items:center;gap:8px}
.stepper .ctl{display:flex;align-items:center;gap:10px}
.stepper .val{font-family:var(--display);font-size:22px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
button{font-family:var(--body);font-weight:800;font-size:16px;border:0;border-radius:12px;cursor:pointer;color:var(--ink);touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);padding:15px 18px;width:100%;box-shadow:0 3px 0 #a87412;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a87412}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);box-shadow:none}
.btn.red{background:var(--uc);box-shadow:0 3px 0 #8e2655}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-direction:column;gap:10px}
.round{width:40px;height:40px;border-radius:50%;background:var(--line);color:var(--fg);font-size:20px;line-height:1;flex:none}
.round:disabled{opacity:.3}
input[type=text]{width:100%;box-sizing:border-box;background:var(--bg);border:1.5px solid var(--line);color:var(--fg);
  font:700 16px var(--body);padding:12px 14px;border-radius:10px;min-width:0}
.names{display:flex;flex-direction:column;gap:8px}
.names .n{display:flex;gap:8px;align-items:center}
.names .n .num{font-family:var(--display);color:var(--muted);width:24px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.names .n button{background:var(--line);color:var(--fg);width:44px;height:44px;flex:none}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted);font-weight:700}
.err{color:var(--uc);font-weight:800;font-size:14px}
.small{font-size:13px}
/* switches */
.sw-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.sw-row:first-of-type{border-top:0}
.sw-row .ic{font-size:22px;width:30px;text-align:center;flex:none;line-height:1.2}
.sw-row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sw-row .tx b{font-size:15px}
.sw-row .tx span{font-size:13px;color:var(--muted);line-height:1.4}
.sw-row .tx em{font-style:normal;font-size:11px;font-weight:900;color:var(--uc);text-transform:uppercase;letter-spacing:.08em}
.sw-row .tx .new{color:var(--accent)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;margin-top:2px;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(20px);background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1.5px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed=true]{background:var(--raise);border-color:var(--accent);color:var(--fg)}
.chip small{color:var(--muted);font-weight:700;margin-left:4px}
details{background:var(--table);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
details summary{font-weight:800;cursor:pointer}
details ul{margin:10px 0 0;padding-left:18px;color:var(--muted);line-height:1.55;display:flex;flex-direction:column;gap:4px}
/* home tiles */
.tiles{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--table);border:1px solid var(--line);
  border-radius:16px;padding:14px;color:var(--fg);transition:transform .1s}
.tile:active{transform:scale(.98)}
.tile .glyph{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--ink)}
.tile .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .tn{font-family:var(--display);font-size:22px;font-weight:400;line-height:1.1}
.tile .td{color:var(--muted);font-size:14px;font-weight:700;line-height:1.4}
.tile .tm{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:900}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pcard{aspect-ratio:3/4;max-width:100%;border-radius:12px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center;position:relative;box-shadow:0 3px 0 #0006;transition:transform .15s}
.pcard:not(:disabled):active{transform:scale(.96)}
.pcard .who{font-weight:900;font-size:15px;word-break:break-word;line-height:1.2}
.pcard.sel{outline:3px solid var(--accent);transform:translateY(-3px)}
.pcard.dead{background:transparent;border:1.5px dashed var(--line);color:var(--muted);box-shadow:none}
.pcard.dead .av{filter:grayscale(1);opacity:.45}
.av{width:46px;height:46px;border-radius:50%;background:var(--avc);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:22px;flex:none;line-height:1}
.bigav{display:flex;flex-direction:column;align-items:center;gap:10px}
.bigav .av{width:96px;height:96px;font-size:44px}
.bigav b{font-family:var(--display);font-weight:400;font-size:26px}
.cardback{aspect-ratio:3/4;max-width:100%;border-radius:12px;border:3px solid var(--paper);
  background:repeating-linear-gradient(45deg,#2b3768 0 7px,#25305c 7px 14px);display:grid;place-items:center;box-shadow:0 3px 0 #0006;transition:transform .15s}
.cardback:not(:disabled):active{transform:scale(.95) rotate(-2deg)}
.cardback .mono{font-family:var(--display);font-size:30px;color:var(--accent);background:var(--bg);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent)}
.cardback.taken{background:var(--line);border-color:var(--line);box-shadow:none;color:var(--muted);font-weight:900;padding:8px;text-align:center;word-break:break-word;font-size:14px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;padding:3px 8px;border-radius:999px;color:var(--ink);white-space:nowrap}
.tag.civ,.tag.town{background:var(--civ)}.tag.uc,.tag.mafia{background:var(--uc)}.tag.mw{background:var(--mw)}.tag.sp{background:var(--sp)}
.tag.gold,.tag.jester{background:var(--accent)}
/* reveal sheet */
.sheet{position:fixed;inset:0;background:#0b0f1cf5;display:flex;align-items:center;justify-content:center;z-index:20;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .inner{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;text-align:center;margin:auto}
.bigcard{width:100%;background:var(--paper);color:var(--ink);border-radius:18px;padding:26px 20px;min-height:220px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #0008}
button.bigcard{cursor:pointer}
.bigcard.back{background:repeating-linear-gradient(45deg,#2b3768 0 9px,#25305c 9px 18px);border:4px solid var(--paper);color:var(--fg)}
.bigcard.back .hint{color:var(--fg)}
.bigcard.flip{animation:flip .25s ease-out}
@keyframes flip{from{transform:rotateY(80deg) scale(.95)}to{transform:none}}
.bigcard .word{font-family:var(--display);font-size:clamp(28px,8.5vw,42px);line-height:1.15;word-break:break-word}
.bigcard .hint{color:var(--ink2);font-weight:800;line-height:1.4}
.bigcard .secret{background:#e6e0d2;border-radius:10px;padding:10px 12px;font-weight:800;font-size:14px;line-height:1.45;color:var(--ink)}
.langbtn{align-self:center;background:var(--raise);color:var(--fg);padding:10px 22px;border-radius:999px;font-family:"Cairo",var(--body)}
[dir=rtl],.ar{font-family:"Cairo",var(--body)}
/* banners & lists */
.banner{display:flex;gap:12px;align-items:center;background:var(--raise);border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.4}
.banner .ic{font-size:22px;flex:none}
.order{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;counter-reset:o}
.order li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;background:var(--bg);font-weight:800}
.order li::before{counter-increment:o;content:counter(o);font-family:var(--display);color:var(--accent);min-width:22px;font-variant-numeric:tabular-nums}
.order li .av{width:30px;height:30px;font-size:14px}
.order li .tag{margin-left:auto}
.order.plain li::before{display:none}
.order li.dead{color:var(--muted)}
.order li.dead .av{filter:grayscale(1);opacity:.45}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.score{display:flex;flex-direction:column;gap:6px}
.score .s{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border-radius:10px;font-weight:800}
.score .s .r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.score .s b{font-family:var(--display);font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums}
.score .s.dead span:first-child{color:var(--muted);text-decoration:line-through}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.words div{background:var(--table);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.words strong{font-size:19px;word-break:break-word}
.words .ar{color:var(--muted);font-weight:800}
.words.one{grid-template-columns:1fr}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,7.5em) 1fr 2em;gap:10px;align-items:center;font-weight:800}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:14px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--muted);border-radius:99px}
.bar.top .tr i{background:var(--uc)}
.bar .n{font-family:var(--display);text-align:right;font-variant-numeric:tabular-nums}
.note{background:var(--raise);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-weight:700;line-height:1.4}
.note.good{border-color:var(--civ)}.note.bad{border-color:var(--uc)}
@keyframes fillbar{to{width:100%}}
.timer{font-family:var(--display);font-size:64px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--uc)}
.locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.loc{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;font-size:15px}
.loc small{font-family:"Cairo",var(--body);color:var(--ink2);font-weight:800;font-size:13px}
.chips .av{width:26px;height:26px;font-size:12px}
.loclist{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;color:var(--muted);font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--paper);color:var(--ink);
  padding:12px 18px;border-radius:12px;font-weight:800;z-index:40;transition:all .25s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.win-title{font-size:36px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const KEY = "majlis-v1";
function defaults(){
  return { players:[], sound:true,
    odd:{uc:1, mw:0, manual:false, specials:{}, modes:{}, cats:Object.fromEntries(Object.keys(CATS).map(k=>[k,true])), used:[]},
    mafia:{mafia:1, manual:false, roles:{doctor:true, detective:true}, reveal:true},
    spy:{spies:1, manual:false, minutes:8, used:[]},
    scores:{odd:{}, mafia:{}, spy:{}} };
}
function loadState(){
  const d = defaults(); let s=null;
  try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s){ // carry over players and scores from the first Odd Word version
    let o=null; try{ o = JSON.parse(localStorage.getItem("oddword-v2")); }catch(e){}
    if(o){ d.players=o.players||[]; d.sound=o.sound!==false;
      Object.assign(d.odd,{uc:o.uc??1, mw:o.mw??0, manual:!!o.manual, specials:o.specials||{}, used:o.used||[]});

const SFX = (()=>{
  let ctx;
  const ac = () => { if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
                     if(ctx.state==="suspended") ctx.resume(); return ctx; };
  function tone(f, d, {type="sine", v=.14, to=null, delay=0}={}){
    if(!S.sound) return; const a=ac(); if(!a) return;
    const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.03);
  }
  function noise(d, v=.18, delay=0){
    if(!S.sound) return; const a=ac(); if(!a) return;
    const b=a.createBuffer(1, a.sampleRate*d, a.sampleRate), x=b.getChannelData(0);
    for(let i=0;i<x.length;i++) x[i]=(Math.random()*2-1)*(1-i/x.length);
    const s=a.createBufferSource(), g=a.createGain(), fl=a.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=900;
    s.buffer=b; g.gain.value=v; s.connect(fl).connect(g).connect(a.destination); s.start(a.currentTime+delay);
  }
  const arp = (fs, step=.1, o={}) => fs.forEach((f,i)=>tone(f, o.d||.22, {...o, delay:(o.delay||0)+i*step}));
  return {
    tap:  ()=>tone(540,.05,{type:"triangle",v:.07}),
    flip: ()=>{ noise(.08,.12); tone(320,.14,{type:"triangle",to:760,v:.1}); },
    vote: ()=>tone(700,.07,{type:"square",v:.045}),
    drum: ()=>{ for(let i=0;i<8;i++) tone(110,.08,{type:"triangle",v:.12,delay:i*.07}); },
    out:  ()=>{ tone(420,.6,{type:"sawtooth",to:70,v:.09}); noise(.35,.2); },
    good: ()=>arp([660,880],.08,{type:"triangle"}),
    bad:  ()=>arp([300,220],.12,{type:"square",v:.06}),
    heart:()=>arp([523,392,330,262],.16,{type:"sine",d:.3}),
    boom: ()=>{ noise(.5,.35); tone(160,.5,{type:"sine",to:40,v:.25}); },
    night:()=>arp([392,330,262],.25,{type:"sine",d:.5,v:.1}),
    dawn: ()=>arp([262,330,392,523],.15,{type:"triangle",d:.35,v:.1}),
    tick: ()=>tone(1200,.03,{type:"square",v:.03}),
    win:  ()=>{ arp([523,659,784,1047],.11,{type:"triangle",d:.3}); arp([1047,1319],.14,{type:"sine",d:.4,v:.08,delay:.5}); },
  };
})();

  if(!fresh.length){ S.odd.used=S.odd.used.filter(w=>!pool.some(p=>p[0]===w)); fresh=pool; }
  const p=rnd(fresh); S.odd.used.push(p[0]); if(S.odd.used.length>400) S.odd.used=S.odd.used.slice(-400);

    btn=ui.sel!=null?`Save ${esc(G.players[ui.sel].name)}`:"";
  } else if(p.role==="detective"){
    if(ui.det!=null){ const t=G.players[ui.det], bad=t.role==="mafia";
      return `<h2>Detective</h2><div class="bigav">${avatar(t.name)}<b>${esc(t.name)}</b></div>
        <div class="note ${bad?"bad":"good"}" style="text-align:center;font-size:20px">${bad?"Is Mafia":"Is not Mafia"}</div>
        <button class="btn" data-act="nightDone">Done</button>`; }
    head=`<h2>Detective: who do you check?</h2><p>You'll see if they're Mafia.</p>`;
    cands=alive().filter(k=>k!==i);
    btn=ui.sel!=null?`Check ${esc(G.players[ui.sel].name)}`:"";
  } else if(p.role==="hunter" && !p.shot){
    head=`<h2>Hunter: use your bullet?</h2><p>You have one bullet for the whole game. Shoot someone tonight, or keep it for later.</p>`;
    cands=alive().filter(k=>k!==i);
    btn=ui.sel!=null?`Shoot ${esc(G.players[ui.sel].name)}`:"";
    return `${head}<div class="grid">${cands.map(k=>pcard(k,{act:"nsel",sel:ui.sel===k})).join("")}</div>
      ${btn?`<button class="btn red" data-act="nightConfirm">${btn}</button>`:""}<button class="btn ghost" data-act="nightDone">Keep my bullet</button>`;
  } else {
    const ready=Date.now()>=G.waitUntil, ms=Math.max(0,G.waitUntil-Date.now());
    return `<h2>${r.name}</h2><p>${p.role==="hunter"?"Your bullet is used. ":""}Nothing to do tonight. Hold the phone for a moment so nobody can guess your role, then pass it.</p>
      <div class="progress"><i style="width:${ready?100:0}%;${ready?"":`animation:fillbar ${ms}ms linear forwards`}"></i></div>
      <button class="btn" data-act="nightDone" ${ready?"":"disabled"}>${ready?"Done":"Wait…"}</button>`;
  }
  return `${head}${extra}<div class="grid">${cands.map(k=>pcard(k,{act:"nsel",sel:ui.sel===k})).join("")}</div>
    ${btn?`<button class="btn" data-act="nightConfirm">${btn}</button>`:""}`;
}
function mafiaNightConfirm(){
  const i=G.nq[G.ni], p=G.players[i], t=ui.sel;
  if(t==null) return;
  if(team(p)==="mafia") G.mPicks[i]=t;
  else if(p.role==="doctor") G.dSave=t;
  else if(p.role==="detective"){ ui={det:t}; return render(); }
  else if(p.role==="hunter"){ G.hShot=t; p.shot=true; }
  G.step="done"; ui={}; render();
}
function mafiaDawn(){
  const tally={}; Object.values(G.mPicks).forEach(t=>tally[t]=(tally[t]||0)+1);
  const mx=Math.max(0,...Object.values(tally));
  const victim = mx>0 ? +rnd(Object.keys(tally).filter(k=>tally[k]===mx)) : null;
  G.lastSave=G.dSave;
  const attacks=[]; if(victim!=null) attacks.push({i:victim, by:"mafia"}); if(G.hShot!=null) attacks.push({i:G.hShot, by:"hunter"});
  const deaths=[]; let saved=false;
  for(const a of attacks){
    if(a.i===G.dSave){ saved=true; continue; }
    if(deaths.some(d=>d.i===a.i)) continue;
    deaths.push(a); G.players[a.i].alive=false; G.players[a.i].cause=a.by==="mafia"?"night":"nightshot";
  }
  G.dawn={deaths, saved};
  G.phase="dawn"; ui={}; render(); SFX.dawn();
  if(deaths.length) setTimeout(SFX.out,500);
}
function mafiaRoleLine(p){ return S.mafia.reveal ? `<span class="tag ${team(p)}">${MR[p.role].name}</span>` : `<span class="tag sp">Role hidden</span>`; }
function mafiaDawnView(){
  const d=G.dawn;
  const rows=d.deaths.map(x=>{ const v=G.players[x.i];
    return `<div class="panel" style="align-items:center"><div class="bigav">${avatar(v.name)}<b>${esc(v.name)}</b></div>
      <p style="text-align:center">${x.by==="mafia"?"was eliminated by the Mafia during the night.":"was shot by the Hunter during the night."}</p>
      <div class="counts" style="justify-content:center">${mafiaRoleLine(v)}</div></div>`; }).join("");
  const savedNote = d.saved ? `<div class="note good">Someone was attacked, but the Doctor saved them.</div>` : "";
  const quiet = !d.deaths.length && !d.saved ? `<div class="note">A quiet night. Nobody died.</div>` : "";
  return `<h2>Morning, day ${G.day+1}</h2><p>Everyone open your eyes.</p>${rows}${savedNote}${quiet}<button class="btn" data-act="dawnNext">Continue</button>`;
}
function mafiaWin(){
  const a=alive(), m=a.filter(i=>team(G.players[i])==="mafia").length, o=a.length-m;
  if(m===0) return "town"; if(m>=o) return "mafia"; return null;
}
function mafiaProceed(next){ const w=mafiaWin(); if(w) return mafiaFinish(w); if(next==="day"){ G.day++; G.phase="day"; ui={}; render(); } else mafiaStartNight(); }
function mafiaAfterDeath(i, next){
  const p=G.players[i];
  if(p.role==="hunter" && !p.shot){ G.hunter=i; G.next=next; G.phase="hunt"; ui={}; return render(); }
  mafiaProceed(next);
}
function mafiaDayView(){
  const a=alive(), dead=G.players.map((p,i)=>i).filter(i=>!G.players[i].alive);

  <div class="panel"><h3>Still in · ${a.length}</h3><ul class="order plain">${a.map(i=>`<li>${avatar(G.players[i].name)}${esc(G.players[i].name)}</li>`).join("")}</ul></div>
  ${dead.length?`<div class="panel"><h3>Out · ${dead.length}</h3><ul class="order plain">${dead.map(i=>`<li class="dead">${avatar(G.players[i].name)}${esc(G.players[i].name)}${mafiaRoleLine(G.players[i])}</li>`).join("")}</ul></div>`:""}

function mafiaTally(){

/* ============================================================
   GAME 3 — THE SPY
   ============================================================ */
const spyMax = n => Math.max(1, Math.floor(n/3));
function spyClamp(){ const s=S.spy, n=S.players.length; if(!s.manual) s.spies = n>=8?2:1; s.spies=Math.min(Math.max(1,s.spies), spyMax(n)); }
function spySetupView(){
  spyClamp();
  const s=S.spy, n=S.players.length, err=playersError(3);
  return `<h2>The Spy</h2>
  ${playersPanel(3)}
  <div class="panel"><h3>Roles</h3>
    ${stepRow("Spies","--uc",s.spies,"spy.spies",s.spies<=1,s.spies>=spyMax(n))}
    ${stepRow("Agents","--civ",Math.max(0,n-s.spies),"")}
    ${s.manual?`<button class="btn ghost" data-act="spyAuto">Back to recommended count</button>`:""}
  </div>
  <div class="panel"><h3>Round timer</h3><div class="chips">${[5,8,10,15].map(m=>`<button class="chip" aria-pressed="${s.minutes===m}" data-act="spyMin" data-arg="${m}">${m} min</button>`).join("")}</div></div>
  <details><summary>How to play</summary><ul>
    <li>Everyone gets the same secret location and a role there, except the spy, who gets nothing.</li>
    <li>Take turns asking one player a question about the location. Whoever answers asks next.</li>
    <li>Agents: prove you know the place without making it obvious. Spy: blend in and work out the location.</li>
    <li>Vote out the player you think is the spy. Catch the spy and they get one last guess at the location.</li>
    <li>At any time the spy can reveal themselves and guess. Right: spies win. Wrong: agents win.</li>
    <li>Points: Spy win 4, Agent win 1.</li></ul>
    <p class="small" style="margin-top:10px">${LOCS.length} locations.</p></details>
  ${err?`<div class="err">${err}</div>`:""}
  <button class="btn" data-act="startGame" ${err?"disabled":""}>Deal the cards</button>`;
}
function spyNewGame(){
  const n=S.players.length, s=S.spy;
  let fresh=LOCS.filter(l=>!s.used.includes(l.en)); if(!fresh.length){ s.used=[]; fresh=LOCS; }
  const loc=rnd(fresh); s.used.push(loc.en); save();
  const roles=shuffle(loc.roles), cards=[];
  for(let i=0;i<s.spies;i++) cards.push("spy");
  for(let k=0;cards.length<n;k++) cards.push(roles[k%roles.length]);
  G={game:"spy", loc, players:S.players.map(name=>({name, spy:false, role:null, alive:true}))};
  startDeal(cards);
}
function spyCardFace(p, ar){
  if(p.spy) return `<span class="word">${ar?"أنت الجاسوس":"You're the Spy"}</span><span class="hint">${ar?"لا تعرف المكان. استمع للأسئلة واكتشفه دون أن تنكشف.":"You don't know the location. Listen to the questions and work it out without getting caught."}</span>`;
  return `<span class="hint">${ar?"المكان":"Location"}</span><span class="word">${esc(ar?G.loc.ar:G.loc.en)}</span><span class="secret">${ar?"دورك":"Your role"}: <b>${esc(ar?p.role.ar:p.role.en)}</b></span>`;
}
let TIMER=null;
const fmt = ms => { const s=Math.ceil(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const spyLeft = () => G.paused!=null ? G.paused : Math.max(0, G.endsAt-Date.now());
function stopTimer(){ clearInterval(TIMER); TIMER=null; }
function spyTick(){
  stopTimer();
  const upd=()=>{
    const el=$("#timer"); if(!el || !G || G.game!=="spy" || G.phase!=="play"){ stopTimer(); return; }
    const r=spyLeft(); el.textContent=fmt(r); el.classList.toggle("low", r<60000);
    if(r<=0 && G.paused==null){ stopTimer(); SFX.bad(); buzz(400); toast("Time's up. Vote now."); spyVote(); }
  };
  upd(); TIMER=setInterval(upd,500);
}
function spyStart(){ G.first=rnd(G.players.map((p,i)=>i)); G.endsAt=Date.now()+S.spy.minutes*60000; G.paused=null; G.phase="play"; ui={}; render(); }
function spyPlayView(){
  return `<div class="panel" style="align-items:center"><div class="timer" id="timer">${fmt(spyLeft())}</div>
    <button class="chip" data-act="spyPause">${G.paused!=null?"Resume timer":"Pause timer"}</button></div>
  <div class="banner">${avatar(G.players[G.first].name)}<span><b>${esc(G.players[G.first].name)}</b> asks the first question. Ask anyone about the location; whoever answers asks next.</span></div>
  <button class="btn" data-act="spyVote">Call a vote</button>
  <button class="btn red" data-act="spyReveal">I'm the spy: guess the location</button>
  <button class="btn ghost" data-act="checkCard">Check my card</button>
  <details><summary>All possible locations</summary><div class="loclist">${LOCS.map(l=>`<span>${esc(l.en)} <span class="ar">· ${esc(l.ar)}</span></span>`).join("")}</div></details>
  ${ui.spyWho?`<div class="sheet"><div class="inner"><h2>Who's the spy?</h2><p>Tap your name.</p><div class="grid">${G.players.map((p,i)=>pcard(i,{act:"spyWho"})).join("")}</div><button class="btn ghost" data-act="spyWhoCancel">Cancel</button></div></div>`:""}`;
}
function spyVote(cands){
  if(G.paused==null) G.paused=spyLeft();
  const all=G.players.map((p,i)=>i);
  beginVote({cands:cands||all, voters:all, onDone:spyTally, revote:!!cands, hint:"Who is the spy? Tap them, then pass the phone."});
}
function spyResume(){ G.endsAt=Date.now()+Math.max(G.paused||0,60000); G.paused=null; G.phase="play"; ui={}; render(); }
function spyTally(){
  const c={}; G.vote.cands.forEach(i=>c[i]=0); Object.values(G.vote.votes).forEach(t=>{ if(t in c) c[t]++; });
  G.res={c,...judge(c)}; G.phase="stally"; ui={}; render(); SFX.drum(); buzz(40);
}
function spyTallyView(){
  const r=G.res, top=r.kind==="out"?[r.i]:r.kind==="tie"?r.tied:[];
  let a;
  if(r.kind==="out") a=`<button class="btn red" data-act="spyAccuse">Accuse ${esc(G.players[r.i].name)}</button>`;
  else if(r.kind==="tie") a=`<div class="note">Tie between ${r.tied.map(i=>esc(G.players[i].name)).join(" and ")}.</div><button class="btn" data-act="spyRevote">Re-vote between them</button><button class="btn ghost" data-act="spyResume">Back to questions</button>`;
  else a=`<button class="btn" data-act="spyResume">Back to questions</button>`;
  return `<h2>The votes are in</h2>${barsHTML(r.c, top)}<div class="btns">${a}</div>`;
}
function spyAccuse(i){
  const p=G.players[i];
  if(p.spy){ G.cur=i; G.self=false; G.phase="sguess"; ui={}; render(); SFX.good(); }
  else spyFinish("spy",{why:`${p.name} was an agent. The spy got away.`});
}
function spyGuessView(){
  const p=G.players[G.cur];
  return `<div class="bigav">${avatar(p.name)}</div><h2 style="text-align:center">${esc(p.name)} ${G.self?"reveals: I'm the spy!":"is a spy!"}</h2>
  <p style="text-align:center">${G.self?"Pick the location. Right: spies win. Wrong: agents win.":"Last chance: pick the location. Right and the spies still win."}</p>
  <div class="locgrid">${LOCS.map((l,k)=>`<button class="loc" data-act="spyPick" data-arg="${k}">${esc(l.en)}<small>${esc(l.ar)}</small></button>`).join("")}</div>`;
}
function spyFinish(w, {why}){
  G.winner=w; G.why=why; G.phase="end";
  const aw=G.players.map(p=> (w==="spy")===p.spy ? [[w==="spy"?4:1,"Win"]] : []);
  award("spy", aw); ui={}; render(); SFX.win(); buzz([80,60,80,60,200]); confetti();
}
function spyEndView(){
  const n=G.players.filter(p=>p.spy).length;
  return `<h2 class="win-title">${G.winner==="spy"?(n>1?"Spies win":"The spy wins"):"Agents win"}</h2><p>${esc(G.why)}</p>

  <div class="panel"><h3>This game</h3><div class="score">${G.players.map((p,i)=>`<div class="s"><span>${esc(p.name)}</span><span class="r">${p.spy?`<span class="tag uc">Spy</span>`:`<span class="tag civ">${esc(p.role.en)}</span>`}${G.awards[i].map(([v])=>ptsTag(v)).join("")}</span></div>`).join("")}</div></div>
  ${boardHTML(S.scores.spy)}
  <button class="btn" data-act="again">Play again</button><button class="btn ghost" data-act="menu">Change rules</button>`;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  let right="", body;
  if(G){ const g=GAMES[G.game]; right=g.label(); body=g.views[G.phase](); }
  else if(APP.screen==="home") body=homeView();
  else { right="Setup"; body=GAMES[APP.screen].setup(); }
  const left = (!G && APP.screen==="home") ? `<div class="logo">${APP_NAME[0]}<span>${APP_NAME[1]}</span></div>`
    : `<button class="back" data-act="${G?"quit":"home"}" aria-label="${G?"Quit game":"Back to games"}">‹</button><div class="logo sm">${GAMES[G?G.game:APP.screen].title}</div>`;
  let html = `<header class="top"><div class="hl">${left}</div><div class="phase">${right}</div></header>${body}`;
  if(G){ if(ui.pickCard) html+=pickCardOverlay(); if(ui.open!=null) html+=sheetView(); }
  $("#app").innerHTML = html;
  document.body.classList.toggle("night", !!G && G.game==="mafia" && G.phase==="night");
  const f=document.querySelector("[data-autofocus]"); if(f) f.focus();
  if(G && G.game==="spy" && G.phase==="play") spyTick(); else stopTimer();
}

  goto(k){ APP.screen=k; render(); scrollTo(0,0); },
  quit(){ if(quitArmed){ quitArmed=false; APP.screen=G.game; G=null; ui={}; render(); return; }
    quitArmed=true; toast("Tap ‹ again to quit this game."); setTimeout(()=>quitArmed=false,3000); },
  startGame(){ GAMES[APP.screen].start(); scrollTo(0,0); },
  again(){ GAMES[G.game].start(); scrollTo(0,0); },
  menu(){ APP.screen=G.game; G=null; ui={}; render(); scrollTo(0,0); },
  // players
  add(){ const el=$("#newname"), v=el.value.trim(); if(!v) return;
    if(S.players.some(p=>p.toLowerCase()===v.toLowerCase())) return toast("That name is taken.");
    if(S.players.length>=20) return;
    S.players.push(v); save(); ui.focusAdd=true; render(); ui.focusAdd=false; },
  rm(i){ S.players.splice(+i,1); save(); render(); },
  resetScores(){ if(resetArmed){ S.scores={odd:{},mafia:{},spy:{}}; save(); resetArmed=false; render(); toast("Leaderboards cleared."); }
    else { resetArmed=true; toast("Tap again to clear every leaderboard."); setTimeout(()=>resetArmed=false,3000); } },
  // settings
  toggle(path){ const ks=path.split("."); let o=S; ks.slice(0,-1).forEach(k=>o=o[k]); const k=ks.at(-1); o[k]=!o[k]; save(); render(); if(path==="sound"&&S.sound) SFX.good(); },
  step(arg){ const [path,d]=arg.split(":"), [g,k]=path.split("."); S[g].manual=true; S[g][k]=Math.max(0,S[g][k]+(+d));
    if(g==="odd") oddClamp(); if(g==="mafia") mafiaClamp(); if(g==="spy") spyClamp(); save(); render(); },
  oddAuto(){ S.odd.manual=false; save(); render(); },
  mafiaAuto(){ S.mafia.manual=false; save(); render(); },
  spyAuto(){ S.spy.manual=false; save(); render(); },
  spyMin(m){ S.spy.minutes=+m; save(); render(); },
  cat(k){ const on=Object.values(S.odd.cats).filter(Boolean).length; if(S.odd.cats[k]&&on===1) return toast("Keep at least one category."); S.odd.cats[k]=!S.odd.cats[k]; save(); render(); },
  // deal & cards
  pick(c){ c=+c; if(G.taken[c]!=null || G.turn>=G.players.length) return;
    G.taken[c]=G.turn; GAMES[G.game].applyCard(G.turn, G.cards[c]); ui={open:G.turn, ar:ui.ar}; SFX.flip(); render(); },
  afterDeal(){ GAMES[G.game].afterDeal(); scrollTo(0,0); },
  peek(){ ui.peek=!ui.peek; if(ui.peek){ ui.peeked=true; SFX.flip(); buzz(20); } else { ui.detPick=false; } render(); },
  lang(){ ui.ar=!ui.ar; render(); },
  gotit(){ if(G.phase==="deal" && ui.open===G.turn) G.turn++; ui={ar:ui.ar}; render(); },
  checkCard(){ ui={pickCard:true, ar:ui.ar}; render(); },
  closePick(){ ui={ar:ui.ar}; render(); },
  open(i){ ui={open:+i, ar:ui.ar}; render(); },
  detPick(){ ui.detPick=true; render(); },
  detect(i){ G.players[ui.open].detUsed=true; ui.detResult=+i; ui.detPick=false; ui.peeked=true; SFX.good(); render(); },
  // voting
  cast(i){ const V=G.vote; V.votes[V.voters[V.vi]]=+i; V.vi++; SFX.vote(); buzz(15); skipEmptyVoters();
    if(V.vi>=V.voters.length) V.onDone(V.votes); else render(); },
  undo(){ const V=G.vote; V.vi--; while(V.vi>0 && !voteOptions(V.voters[V.vi]).length) V.vi--; delete V.votes[V.voters[V.vi]]; render(); },
  voteBack(){ GAMES[G.game].voteBack(); ui={}; render(); },
  // odd word
  fstep(){ ui.f=1; render(); },
  fskip(){ G.phase="describe"; ui={}; render(); },
  ftarget(i){ ui.ft=+i; render(); },
  fgive(kind){ G.falafel={i:ui.ft, kind}; G.phase="describe"; ui={}; render(); toast("Falafel delivered. Pass the phone back."); },
  oddVote(){ oddStartVote(); },
  oddOut(){ oddEliminate(G.res.i,"vote"); },
  oddNext(){ const w=oddCheckWin(); if(w) oddFinish(w); else oddStartRound(); },
  toGoddess(){ G.phase="goddess"; render(); },
  judgeOdd(i){ i=+i; if(oddBoomerang(i)){ G.phase="tally"; return render(); } oddEliminate(i,"judge"); },
  oddRevote(){ oddStartVote(G.res.tied); },
  oddRandom(){ const i=rnd(G.res.tied); if(oddBoomerang(i)) return render(); oddEliminate(i,"draw"); },
  oddAfterOut(){ oddAfterOut(); },
  guess(){ const p=G.players[G.cur], g=$("#guess").value; if(!g.trim()) return;
    p.guessed=true;
    if([G.civ.en,G.civ.ar].some(w=>norm(w)===norm(g))){ G.queue=[]; toast(`“${g}” is right!`); return oddFinish(["mw"]); }
    p.wrong=true; SFX.bad(); toast(`“${g}” is wrong.`); oddAfterOut(); },
  avenge(i){ const p=G.players[G.cur]; p.revenged=true; G.queue.unshift({i:+i, cause:"revenge", by:G.cur}); SFX.boom(); oddAfterOut(); },
  // mafia
  nightOpen(){ G.step="act"; ui={};
    const p=G.players[G.nq[G.ni]], passive=["villager","jester"].includes(p.role) || (p.role==="hunter" && p.shot);
    if(passive){ const ms=4000+Math.random()*3000; G.waitUntil=Date.now()+ms;
      setTimeout(()=>{ if(G && G.phase==="night" && G.step==="act") render(); }, ms+60); }
    render(); },
  nsel(i){ ui.sel=+i; render(); },
  nightConfirm(){ mafiaNightConfirm(); },
  nightDone(){ G.step="done"; ui={}; render(); },
  nightNext(){ G.ni++; if(G.ni>=G.nq.length) mafiaDawn(); else { G.step="pass"; ui={}; render(); } },
  dawnNext(){ const h=G.dawn.deaths.map(x=>x.i).find(i=>G.players[i].role==="hunter" && !G.players[i].shot);
    if(h!=null){ G.hunter=h; G.next="day"; G.phase="hunt"; ui={}; render(); } else mafiaProceed("day"); },
  holdFire(){ G.players[G.hunter].shot=true; toast("The Hunter kept the bullet."); mafiaProceed(G.next); },
  mafiaVote(){ const a=alive(); beginVote({cands:a, voters:a, onDone:mafiaTally, hint:"Tap who you think is Mafia, then pass the phone."}); },
  mafiaRevote(){ beginVote({cands:G.res.tied, voters:alive(), onDone:mafiaTally, revote:true}); },
  mafiaNoOne(){ toast("Nobody leaves today."); mafiaProceed("night"); },
  mafiaOut(){ const i=G.res.i, p=G.players[i]; p.alive=false; p.cause="vote"; SFX.out(); buzz([60,40,120]);
    if(p.role==="jester") return mafiaFinish("jester", i);
    G.cur=i; G.next="night"; G.phase="mout"; ui={}; render(); },
  mafiaAfterOut(){ mafiaAfterDeath(G.cur, G.next); },
  shoot(i){ i=+i; G.players[G.hunter].shot=true; const p=G.players[i]; p.alive=false; p.cause="shot"; SFX.boom(); buzz([60,40,120]);
    G.cur=i; G.phase="mout"; ui={}; render(); },
  // spy
  spyPause(){ if(G.paused!=null){ G.endsAt=Date.now()+G.paused; G.paused=null; } else G.paused=spyLeft(); render(); },
  spyVote(){ spyVote(); },
  spyRevote(){ spyVote(G.res.tied); },
  spyResume(){ spyResume(); },
  spyAccuse(){ spyAccuse(G.res.i); },
  spyReveal(){ ui.spyWho=true; render(); },
  spyWhoCancel(){ ui={}; render(); },
  spyWho(i){ i=+i; const p=G.players[i];
    if(!p.spy){ ui={}; render(); return toast(`${p.name} isn't a spy.`); }
    G.paused=spyLeft(); G.cur=i; G.self=true; G.phase="sguess"; ui={}; render(); },
  spyPick(k){ const l=LOCS[+k], ok=l.en===G.loc.en, p=G.players[G.cur];
    if(ok) spyFinish("spy",{why:`${p.name} guessed the location: ${l.en}.`});
    else spyFinish("agents",{why:`${p.name} guessed ${l.en}. Wrong location.`}); },
};

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(!["cast","pick","peek"].includes(b.dataset.act)) SFX.tap();
  ACT[b.dataset.act](b.dataset.arg, b);
});
document.addEventListener("change", e=>{
  const el=e.target.closest("[data-name]"); if(!el) return;
  const v=el.value.trim(), i=+el.dataset.name;
  if(v && !S.players.some((p,k)=>k!==i && p.toLowerCase()===v.toLowerCase())) S.players[i]=v; else toast(v?"That name is taken.":"Name can't be empty.");
  save(); render();
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="newname") ACT.add();
  if(e.key==="Enter" && e.target.id==="guess") ACT.guess();
});

function toast(m){
  let t=document.querySelector(".toast");
  if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent=m; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),2600);
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas"); cv.className="confetti"; document.body.appendChild(cv);
  const d=devicePixelRatio||1, x=cv.getContext("2d"), W=cv.width=innerWidth*d, H=cv.height=innerHeight*d;
  const cols=["#f2b33d","#3cc4a8","#e2558f","#cfd6ea","#8fa8ff"];
  const ps=Array.from({length:150},()=>({x:Math.random()*W, y:-Math.random()*H*.6, vx:(Math.random()-.5)*4*d, vy:(2+Math.random()*4)*d,
    s:(5+Math.random()*7)*d, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:rnd(cols)}));
  let t=0;(function f(){ x.clearRect(0,0,W,H);
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.vy+=.05*d; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }
    if(++t<240) requestAnimationFrame(f); else cv.remove(); })();
}

render();
</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
